name: Dependency check

# OWASP dependency-check on the API's Maven dependencies. Fails the
# build when any dependency has a vulnerability with CVSS >= 7.
# The NVD API key must be stored as a repository secret named
# NVD_API_KEY (without it the NVD download is slow and rate-limited).
# Runs on every push/PR and weekly, so a newly disclosed CVE is
# caught even when no code changed.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  dependency-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check the NVD API key is configured
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          test -n "$NVD_API_KEY" || {
            echo "NVD_API_KEY secret is not configured."
            exit 1
          }

      - name: Cache the NVD vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-data-${{ runner.os }}

      - name: OWASP dependency-check (fail at CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -f api/pom.xml org.owasp:dependency-check-maven:13.0.0:check \
            -DnvdApiKey="$NVD_API_KEY" -Dowasp.skip=false -DfailBuildOnCVSS=7
