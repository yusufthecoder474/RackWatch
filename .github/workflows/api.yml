name: API

# Spring Boot API: unit tests + Testcontainers integration tests +
# the JaCoCo 80% line-coverage gate (mvn verify). The integration
# tests need Docker, which the GitHub-hosted runners provide.
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify (unit + integration tests, JaCoCo gate)
        run: mvn -f api/pom.xml verify
