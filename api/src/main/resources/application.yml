# RackWatch API — application.yml
# Spring Boot 4.1.3, Java 21, PostgreSQL 16 (see the version note at the
# bottom of this file). Every secret comes from the environment; nothing
# secret is written in this file.

server:
  port: 8080
  address: 0.0.0.0
  error:
    # Never leak stack traces or internal messages in error responses.
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: rackwatch
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rackwatch}
    username: ${DB_USER:rackwatch}
    # No default password: if neither DB_PASSWORD nor the standard
    # SPRING_DATASOURCE_PASSWORD environment variable is set, the
    # application fails fast at startup instead of connecting with a
    # guessed password. docker-compose sets SPRING_DATASOURCE_PASSWORD
    # from the required POSTGRES_PASSWORD. Run locally with either
    # DB_PASSWORD or SPRING_DATASOURCE_PASSWORD in the environment.
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    # Flyway owns the schema; Hibernate only validates it matches the entities.
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    # JSON uses snake_case (sensor_id, temp_c, rh_pct, opened_at) so the
    # API matches what the C daemon sends, without @JsonProperty on
    # every field.
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Uploads are not part of this API; keep the multipart ceiling low.
      max-file-size: 1MB
      max-request-size: 1MB

management:
  endpoints:
    web:
      exposure:
        # Only health and info are exposed; no env, beans, or mappings.
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.rackwatch: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

# --- RackWatch settings -------------------------------------------------
# Limits follow ASHRAE-style guidance for server rooms (18-27 C,
# 40-60 %RH) as defaults only. They are configurable here because every
# site is different: confirm the right limits for your site before
# relying on them. The daemon never hard-codes limits; the API owns them.
rackwatch:
  # API key for every /api route. Read from the environment only:
  #   RACKWATCH_API_KEY=<key>   (docker-compose passes it through)
  # There is intentionally no default value: if the variable is unset
  # the application fails fast at startup instead of running unauthenticated.
  api-key: ${RACKWATCH_API_KEY}
  security:
    # The API-key filter (Part 2) protects /api/**, /v3/api-docs/** and
    # /swagger-ui/**. This is the filter's whole public list: exactly
    # one entry, /actuator/health, so the compose healthcheck and any
    # load-balancer probe work without a key. Nothing else is exempt —
    # not the Swagger UI, not the API docs. Static dashboard files
    # (/, /index.html, /css/dashboard.css, /js/dashboard.js,
    # /js/chart.umd.min.js) carry no data and are served without a
    # key — they are listed exactly in ApiKeyFilter, not here; every
    # data call the dashboard makes goes through /api and requires the
    # key (Part 5: the dashboard asks for the key once and keeps it in
    # sessionStorage, never baked into the page).
    public-paths:
      - /actuator/health
  limits:
    temp-min-c: 18.0
    temp-max-c: 27.0
    rh-min-pct: 40.0
    rh-max-pct: 60.0
  ingestion:
    max-batch-size: 100
    # Bodies larger than 64 KiB are rejected with 413. Enforced by a
    # request-size filter (Part 2) that counts the bytes actually read,
    # so it also covers chunked requests that send no Content-Length
    # header — the filter never trusts the header alone.
    max-request-bytes: 65536
  alerts:
    # R1 NAIVE is kept only as a baseline for the evaluation replay
    # (Part 3). It is OFF in live ingestion: the live ingestion path
    # never calls it and never writes NAIVE_OUT_OF_RANGE alerts. The
    # evaluation test enables the naive replay explicitly, in memory
    # only, through its own evaluator call.
    naive:
      enabled: false
    # R2 SMART_THRESHOLD: open after this many consecutive out-of-range
    # readings; clear after this many consecutive in-range readings.
    smart:
      consecutive-out-of-range: 3
      consecutive-clear: 3
      # Hysteresis margin for clearing: a reading counts as "back inside"
      # only if it is this far inside the limit (1 C / 3 %RH).
      hysteresis-temp-c: 1.0
      hysteresis-rh-pct: 3.0
    # R3 RATE_OF_CHANGE: temp rise of this much inside this window.
    # The rise must be HELD: it is measured as the minimum of the last
    # confirm-readings values minus the window minimum, so a single
    # out-of-range blip (which rises fast and falls straight back)
    # cannot open a rate alert. Without this, R3 fired on every blip
    # in the normal-day scenario — 5 false alarms for the smart system.
    rate:
      window-minutes: 10
      min-rise-c: 3.0
      confirm-readings: 3
    # R4 SENSOR_HEALTH: flatline after this many identical readings, or
    # a jump larger than this between consecutive readings.
    health:
      flatline-readings: 30
      max-jump-c: 15.0

---
# Test profile: `spring.profiles.active=test`.
# Supplies the API key so unit and MockMvc tests never need the real
# environment variable, and so a missing RACKWATCH_API_KEY cannot make
# the test suite fail for a reason unrelated to the code. The key below
# is test-only and must never be used outside tests. Integration tests
# (Part 6) supply their own datasource through Testcontainers; this
# profile deliberately sets no datasource URL of its own.
spring:
  config:
    activate:
      on-profile: test
rackwatch:
  api-key: test-api-key-only-for-tests

# --- Version note (checked 2026-11-23) ----------------------------------
# Java 21 (LTS): supported — Eclipse Temurin builds available at least
#   to Dec 2029; Oracle Premier Support to Sep 2028.
# PostgreSQL 16: supported — community fixes to 9 Nov 2028
#   (postgresql.org/support/versioning/).
# Spring Boot 3.x: the brief pinned "latest stable Spring Boot 3.x",
#   but that line is NO LONGER SUPPORTED: open-source support for
#   Spring Boot 3.5.x, the last 3.x line, ended 30 Jun 2026
#   (spring.io support table; last free release 3.5.16). Running a new
#   project on it would mean no free security fixes. This project
#   therefore uses Spring Boot 4.1.3 instead — the latest supported
#   stable line at the time of writing, OSS support to 31 Jul 2027,
#   Java 17+ (Java 21 here), Jakarta EE 11. If you must stay on 3.x
#   for a course requirement, pin 3.5.16 knowingly and say so in the
#   README limitations; the code in Parts 2-3 is written against the
#   Boot 4 / Jakarta namespace and would need jakarta.* -> javax.*
#   reverts plus a springdoc downgrade to run on 3.x.
