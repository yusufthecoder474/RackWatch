# RackWatch sensors.conf — one sensor per line:
#   sensor_id kind mode base
#
# kind: temp | humidity
# mode: normal | cooling_failure | stuck
# base: the value the sensor hovers around (degrees C for temp, %RH for humidity)
#
# normal: base + noise, with an occasional single-reading blip.
# cooling_failure: temp ramps +0.5 C per reading to base+10, then holds
#   with noise. Meaningful for temp sensors only; a humidity sensor in
#   this mode is treated as normal (the daemon logs a warning).
# stuck: normal for 30 readings, then a flatline at base+0.5.
#
# The sensor ids must exist in the API (see V2__seed_rooms_sensors.sql):
# an unknown id makes the API reject the whole batch with 400, and the
# daemon quarantines it.
ROOM-A-TEMP-01 temp normal 22.0
ROOM-A-RH-01 humidity normal 50.0
ROOM-B-TEMP-01 temp normal 22.0
ROOM-B-RH-01 humidity normal 50.0

# Examples for the other modes (uncomment to demo them):
# ROOM-B-TEMP-01 temp cooling_failure 22.0
# ROOM-B-RH-01 humidity stuck 50.0
